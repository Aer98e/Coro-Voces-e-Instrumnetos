<div class="view-content view-profile fade-in">
  <div class="profile-layout">
    <section class="profile-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
        <h2 class="section-title" style="margin: 0;">Mi Perfil</h2>
        <a href="#/home" class="btn btn-ghost" style="text-decoration: none;">← Volver al inicio</a>
      </div>
      
      <div class="profile-info-card">
        <div class="profile-avatar">
          <span id="profile-avatar-initial" class="avatar-initial">?</span>
        </div>
        <div class="profile-details">
          <p class="field-label">Correo Electrónico</p>
          <h3 id="profile-email" class="profile-value">Cargando...</h3>
          
          <p class="field-label" style="margin-top: 1rem;">Nivel de Acceso</p>
          <span id="profile-role-badge" class="badge badge-role badge-large">...</span>
        </div>
      </div>
    </section>

    <section class="password-panel">
      <h2 class="section-title">Seguridad</h2>
      
      <form id="password-change-form" class="password-card">
        <p class="modal-subtitle-login" style="margin-bottom: 1.5rem; text-align: left;">Actualiza tu contraseña para mantener tu cuenta segura.</p>
        
        <div class="form-group-login">
          <label for="new-password" class="field-label">Nueva Contraseña</label>
          <input
            id="new-password"
            type="password"
            class="search-input"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
          >
        </div>
        
        <div class="form-group-login">
          <label for="confirm-password" class="field-label">Confirmar Contraseña</label>
          <input
            id="confirm-password"
            type="password"
            class="search-input"
            placeholder="Repite la nueva contraseña"
            required
            minlength="6"
          >
        </div>
        
        <div id="password-error" class="login-error-message hidden"></div>
        <div id="password-success" class="login-success-message hidden"></div>
        
        <button type="submit" id="btn-password-submit" class="btn btn-login-submit" style="margin-top: 1rem;">
          <span class="btn-text">Actualizar Contraseña</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </section>
  </div>
</div>
